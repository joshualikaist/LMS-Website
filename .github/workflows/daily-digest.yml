name: Daily digest

on:
  schedule:
    # 10:00 Asia/Seoul (UTC+9). GitHub often delays this window.
    - cron: "0 1 * * *"
    # Noon KST catch-up if the first run was skipped or late.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch morning edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-digest.mjs

      - name: Commit edition
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digest/editions
          if git diff --staged --quiet; then
            echo "No digest changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: morning snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "No deploy hook set; GitHub → Vercel integration should pick up the push."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
