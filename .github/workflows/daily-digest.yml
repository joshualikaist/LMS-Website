name: Daily digest

on:
  schedule:
    # 10:00 Asia/Seoul (UTC+9). GitHub often delays this window.
    - cron: "0 1 * * *"
    # Noon KST catch-up if the first run was skipped or late.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch morning edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-digest.mjs

      - name: Commit edition
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digest/editions
          if git diff --staged --quiet; then
            echo "No digest changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: morning snapshot $(date -u +%Y-%m-%d)"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "No deploy hook set; GitHub → Vercel integration should pick up the push."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Point joshualisky.vercel.app at production
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Set repo secret VERCEL_TOKEN so joshualisky.vercel.app follows each digest."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = "team_RQPpqkxaimR4vreszcEEcTOT"
          project = "prj_0d8PBne2gIq3AHSiGQy6MERo26g2"

          def load(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(req) as res:
                  return json.load(res)

          dep = None
          for _ in range(20):
              listing = load(
                  f"https://api.vercel.com/v6/deployments?projectId={project}&teamId={team}&target=production&limit=8"
              )
              for item in listing.get("deployments", []):
                  message = (item.get("meta") or {}).get("githubCommitMessage", "")
                  if item.get("readyState") == "READY" and message.startswith("digest:"):
                      dep = item
                      break
              if dep:
                  break
              time.sleep(15)

          if not dep:
              raise SystemExit("No READY digest deployment yet")

          load(
              f"https://api.vercel.com/v2/deployments/{dep['uid']}/aliases?teamId={team}",
              {"alias": "joshualisky.vercel.app"},
          )
          print("pointed joshualisky.vercel.app at", dep.get("url"))
          PY
