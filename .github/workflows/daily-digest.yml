name: Daily digest

on:
  schedule:
    # 10:00 Asia/Seoul (UTC+9). This repo's scheduled jobs often start ~4h late,
    # so extra slots catch a skipped or delayed 10:00 run without rewriting
    # an edition that already exists.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch morning edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-digest.mjs

      - name: Commit edition
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digest/editions
          if git diff --staged --quiet; then
            echo "No digest changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: morning snapshot $(date -u +%Y-%m-%d)"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror edition onto lab
        id: lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main lab
          git checkout -B lab origin/lab
          git checkout origin/main -- content/digest/editions
          git add content/digest/editions
          if git diff --staged --quiet; then
            echo "lab already has editions"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: morning snapshot $(date -u +%Y-%m-%d)"
            git push origin lab
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          git checkout main

      - name: Deploy production
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "No deploy hook set; GitHub → Vercel integration should pick up the push."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Point live Trend URLs
        if: steps.commit.outputs.changed == 'true' || steps.lab.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MAIN_SHA: ${{ steps.commit.outputs.sha }}
          LAB_SHA: ${{ steps.lab.outputs.sha }}
          MAIN_CHANGED: ${{ steps.commit.outputs.changed }}
          LAB_CHANGED: ${{ steps.lab.outputs.changed }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Set repo secret VERCEL_TOKEN so live Trend URLs follow each digest."
            exit 0
          fi
          if [ "$MAIN_CHANGED" = "true" ] && [ -n "$MAIN_SHA" ]; then
            python3 scripts/point-vercel-alias.py joshualisky.vercel.app "$MAIN_SHA" --production
          fi
          if [ "$LAB_CHANGED" = "true" ] && [ -n "$LAB_SHA" ]; then
            python3 scripts/point-vercel-alias.py joshualisky-lab.vercel.app "$LAB_SHA"
          fi
